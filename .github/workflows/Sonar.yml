name: SonarQube Analysis

permissions:
  contents: read

# Analyze only the long-lived branch. Community-Edition Sonar has no branch/PR
# support — every analysis writes to the single main branch. PR build/test feedback
# is covered by CI.yml.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    # A normal run takes ~6 min; the rest covers the server check and begin retries below.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scanner engine runs on this Java (begin passes sonar.scanner.skipJreProvisioning),
      # instead of a JRE downloaded from the self-hosted server on every cache miss. Temurin 21
      # comes preinstalled on ubuntu-latest, so this resolves from the runner's tool cache.
      - name: Set up JDK 21
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The SonarQube server is self-hosted and sometimes unreachable for a few minutes
      # (404 from /api/server/version on 2026-10-19). Wait for it here so an outage fails
      # with a clear message instead of a scanner stack trace. The version also keys the
      # cache below.
      - name: Check SonarQube server
        id: sonar-server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            version=$(curl --fail --silent --show-error --max-time 30 "${SONAR_HOST_URL%/}/api/server/version") || version=""
            if [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "SonarQube $version is up."
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "SonarQube server not ready (attempt $attempt of 5); retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::The SonarQube server did not answer /api/server/version after 5 attempts."
          exit 1

      # The scanner downloads its analyzer plugins from the server into ~/.sonar/cache.
      # Key the cache on the server version: actions/cache never re-saves an existing key, so
      # a fixed key kept the first snapshot forever and every run after a server upgrade
      # downloaded everything again. No restore-keys, so each server version starts clean
      # instead of piling up the plugins of older ones.
      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.sonar-server.outputs.version }}

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Restore dependencies
        run: dotnet restore

      # begin downloads the analyzer plugins from the server on a cache miss. A dropped
      # connection aborts it with an unhandled exception (2026-11-04), so retry it.
      - name: Begin SonarQube analysis
        run: |
          args=(
            /k:"${{ secrets.SONAR_PROJECT_KEY }}"
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
            /d:sonar.coverage.exclusions="**/tests/**,**/Program.cs,**/Modules/**,**/*ServiceCollectionExtensions.cs,**/DesignTimeDbContextFactory.cs,**/DiscordOptions.cs,**/WorkspaceOptions.cs,**/MapOptions.cs,**/DiscordBotService.cs,**/DiscordUserDmSender.cs,**/DiscordChannelMessenger.cs,**/Discord*ChannelPoster.cs,**/DiscordTeamChatWebhookPoster.cs,**/DiscordWorkspaceGateway.cs,**/RustPlusSocketSource.cs,**/RustPlusFcmPairingSource.cs,**/DiscordChatWebhookPoster.cs,**/DiscordClanFeedPoster.cs,**/ServerAutocompleteHandler.cs"
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
            /d:sonar.cpd.exclusions="**/Migrations/*.cs,**/Configurations/*.cs,**/Modules/*.cs"
            /d:sonar.exclusions="**/Migrations/*.cs,**/obj/**,**/bin/**"
            /d:sonar.scanner.skipJreProvisioning=true
          )
          for attempt in 1 2 3; do
            if ./.sonar/scanner/dotnet-sonarscanner begin "${args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::SonarQube begin failed (attempt $attempt of 3); retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The JUnit files are for Codecov test analytics, which only reads JUnit XML.
      - name: Test
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/test-results/{assembly}.junit.xml" \
            --blame-hang-timeout 60s

      - name: End SonarQube analysis
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: ./test-results
